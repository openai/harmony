# Kept separate from CI.yml on purpose: that file is generated by
# `maturin generate-ci github`, so a job added there is lost on the next
# regeneration.
name: wasm32

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: cargo check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # The crate carries a cfg(target_arch = "wasm32") branch that nothing
      # built, so it drifted out of compiling and stayed that way for a year.
      # Checking the target is what stops that recurring.
      - name: Check wasm32 target
        shell: bash
        run: |
          cargo check --target wasm32-unknown-unknown --lib
